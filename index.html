<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cardápio Digital</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    :root {
      --primary-color: #e63946;
      --secondary-color: #f1faee;
      --dark-color: #1d3557;
      --light-color: #f8f9fa;
      --accent-color: #457b9d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--light-color);
      color: #333;
      padding-bottom: 80px;
    }

    /* Topo do Administrador */
    .admin-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: var(--dark-color);
      color: #fff;
    }

    .admin-controls {
      display: flex;
      gap: 10px;
    }

    /* Cover / Banner Section */
    .cover-container {
      position: relative;
      width: 100%;
      height: 220px;
      background-color: var(--dark-color);
      overflow: hidden;
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cover-upload-btn {
      position: absolute;
      bottom: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      display: none; /* Exibido apenas para ADM */
      align-items: center;
      gap: 6px;
      border: 1px solid #fff;
    }

    /* Header Profile Info */
    .header-info {
      padding: 20px;
      text-align: center;
      background-color: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .header-info h1 {
      font-size: 1.8rem;
      color: var(--dark-color);
      margin-bottom: 5px;
    }

    .header-info p {
      color: #666;
      font-size: 0.95rem;
    }

    /* Container Principal */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 15px;
    }

    /* Estilo dos Produtos */
    .section-title {
      font-size: 1.3rem;
      color: var(--dark-color);
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 5px;
      margin-bottom: 15px;
    }

    .product-card {
      display: flex;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 15px;
      overflow: hidden;
    }

    .product-img-container {
      width: 120px;
      min-width: 120px;
      height: 120px;
      background-color: #eee;
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-details {
      padding: 12px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-title {
      font-weight: bold;
      font-size: 1.1rem;
      color: #222;
    }

    .product-desc {
      font-size: 0.85rem;
      color: #666;
      margin: 5px 0;
    }

    .product-price {
      font-size: 1rem;
      font-weight: bold;
      color: var(--primary-color);
    }

    .product-actions {
      display: none; /* Visível apenas para ADM */
      gap: 8px;
      margin-top: 8px;
    }

    /* Botões */
    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-primary { background: var(--primary-color); color: #fff; }
    .btn-secondary { background: var(--accent-color); color: #fff; }
    .btn-danger { background: #d90429; color: #fff; }
    .btn-success { background: #2b9348; color: #fff; }

    /* Estilo dos Modais */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .modal-header {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 15px;
      color: var(--dark-color);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: #444;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    input[type="file"] {
      display: none;
    }
  </style>

  <!-- Script Firebase v10 em formato de Módulo -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getStorage, ref, uploadBytes, getDownloadURL 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
    import { 
      getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Suas configurações reais do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBAYVAy-f-0ir8ePh7wcKxBKQxBadPDT0o",
      authDomain: "loja-virtual-a71e6.firebaseapp.com",
      projectId: "loja-virtual-a71e6",
      storageBucket: "loja-virtual-a71e6.firebasestorage.app",
      messagingSenderId: "517189427475",
      appId: "1:517189427475:web:99c1283482f9aed860fae6"
    };

    // Inicialização dos serviços do Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const auth = getAuth(app);

    let isAdmin = false;
    let currentEditingProductId = null;

    // 1. CARREGAR CONFIGURAÇÃO DA LOJA (Imagem de Capa e Textos)
    const coverImageEl = document.getElementById('cover-image');
    const storeNameEl = document.getElementById('store-name');
    const storeDescEl = document.getElementById('store-desc');

    onSnapshot(doc(db, "store_config", "info"), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        if (data.coverUrl) coverImageEl.src = data.coverUrl;
        if (data.name) storeNameEl.textContent = data.name;
        if (data.description) storeDescEl.textContent = data.description;
      }
    });

    // 2. CARREGAR PRODUTOS EM TEMPO REAL
    const productsContainer = document.getElementById('products-container');

    onSnapshot(collection(db, "products"), (snapshot) => {
      productsContainer.innerHTML = "";
      if (snapshot.empty) {
        productsContainer.innerHTML = "<p style='text-align:center; padding: 20px; color:#888;'>Nenhum produto cadastrado.</p>";
        return;
      }

      snapshot.forEach((documento) => {
        const item = documento.data();
        const id = documento.id;
        
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="product-img-container">
            <img src="${item.imageUrl || 'https://via.placeholder.com/120?text=Sem+Foto'}" class="product-img" alt="${item.name}">
          </div>
          <div class="product-details">
            <div>
              <div class="product-title">${item.name}</div>
              <div class="product-desc">${item.description || ''}</div>
            </div>
            <div class="product-price">R$ ${parseFloat(item.price).toFixed(2).replace('.', ',')}</div>
            <div class="product-actions" style="display: ${isAdmin ? 'flex' : 'none'};">
              <button class="btn btn-secondary" onclick="editProduct('${id}', '${item.name}', '${item.description || ''}', '${item.price}', '${item.imageUrl || ''}')">
                <i class="fa-solid fa-pen"></i> Editar
              </button>
              <button class="btn btn-danger" onclick="deleteProduct('${id}')">
                <i class="fa-solid fa-trash"></i> Excluir
              </button>
            </div>
          </div>
        `;
        productsContainer.appendChild(card);
      });
    });

    // 3. MONITORAR STATUS DE AUTENTICAÇÃO
    onAuthStateChanged(auth, (user) => {
      isAdmin = !!user;
      document.getElementById('admin-status').textContent = isAdmin ? "Modo Administrador Ativo" : "Modo Cliente";
      document.getElementById('btn-login-modal').style.display = isAdmin ? "none" : "inline-flex";
      document.getElementById('btn-logout').style.display = isAdmin ? "inline-flex" : "none";
      document.getElementById('btn-add-product').style.display = isAdmin ? "inline-flex" : "none";
      document.getElementById('cover-upload-label').style.display = isAdmin ? "inline-flex" : "none";

      document.querySelectorAll('.product-actions').forEach(el => {
        el.style.display = isAdmin ? 'flex' : 'none';
      });
    });

    // 4. UPLOAD DE CAPA DO ESTABELECIMENTO
    document.getElementById('cover-file-input').addEventListener('change', async (e) => {
      if (!isAdmin) return;
      const file = e.target.files[0];
      if (!file) return;

      try {
        const storageRef = ref(storage, `covers/cover_${Date.now()}`);
        await uploadBytes(storageRef, file);
        const url = await getDownloadURL(storageRef);

        await setDoc(doc(db, "store_config", "info"), { coverUrl: url }, { merge: true });
        alert("Capa atualizada com sucesso!");
      } catch (err) {
        console.error(err);
        alert("Erro ao enviar imagem de capa.");
      }
    });

    // 5. SALVAR / EDITAR PRODUTO
    document.getElementById('product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!isAdmin) return;

      const name = document.getElementById('prod-name').value;
      const description = document.getElementById('prod-desc').value;
      const price = parseFloat(document.getElementById('prod-price').value);
      const fileInput = document.getElementById('prod-file-input');
      let imageUrl = document.getElementById('prod-current-image-url').value;

      try {
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const storageRef = ref(storage, `products/prod_${Date.now()}`);
          await uploadBytes(storageRef, file);
          imageUrl = await getDownloadURL(storageRef);
        }

        const productData = { name, description, price, imageUrl };

        if (currentEditingProductId) {
          await updateDoc(doc(db, "products", currentEditingProductId), productData);
          alert("Produto atualizado!");
        } else {
          await addDoc(collection(db, "products"), productData);
          alert("Produto cadastrado!");
        }

        closeProductModal();
      } catch (err) {
        console.error(err);
        alert("Erro ao salvar o produto.");
      }
    });

    // Métodos expostos para interações nos botões da interface
    window.openLoginModal = () => document.getElementById('modal-login').style.display = 'flex';
    window.closeLoginModal = () => document.getElementById('modal-login').style.display = 'none';

    window.loginAdmin = async () => {
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-pass').value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        closeLoginModal();
      } catch (err) {
        alert("Erro na autenticação: " + err.message);
      }
    };

    window.logoutAdmin = () => signOut(auth);

    window.openProductModal = () => {
      currentEditingProductId = null;
      document.getElementById('product-form').reset();
      document.getElementById('prod-current-image-url').value = '';
      document.getElementById('modal-product-title').textContent = "Adicionar Produto";
      document.getElementById('modal-product').style.display = 'flex';
    };

    window.closeProductModal = () => document.getElementById('modal-product').style.display = 'none';

    window.editProduct = (id, name, description, price, imageUrl) => {
      currentEditingProductId = id;
      document.getElementById('prod-name').value = name;
      document.getElementById('prod-desc').value = description;
      document.getElementById('prod-price').value = price;
      document.getElementById('prod-current-image-url').value = imageUrl;
      document.getElementById('modal-product-title').textContent = "Editar Produto";
      document.getElementById('modal-product').style.display = 'flex';
    };

    window.deleteProduct = async (id) => {
      if (!isAdmin) return;
      if (confirm("Deseja realmente excluir este produto?")) {
        try {
          await deleteDoc(doc(db, "products", id));
        } catch (err) {
          alert("Erro ao excluir produto.");
        }
      }
    };
  </script>
</head>
<body>

  <!-- Barra do Administrador -->
  <div class="admin-bar">
    <span id="admin-status">Modo Cliente</span>
    <div class="admin-controls">
      <button id="btn-add-product" class="btn btn-success" style="display:none;" onclick="openProductModal()">
        <i class="fa-solid fa-plus"></i> Novo Produto
      </button>
      <button id="btn-login-modal" class="btn btn-secondary" onclick="openLoginModal()">
        <i class="fa-solid fa-user-lock"></i> Acesso ADM
      </button>
      <button id="btn-logout" class="btn btn-danger" style="display:none;" onclick="logoutAdmin()">
        <i class="fa-solid fa-right-from-bracket"></i> Sair
      </button>
    </div>
  </div>

  <!-- Banner de Capa -->
  <div class="cover-container">
    <img id="cover-image" src="https://via.placeholder.com/800x220?text=Capa+da+Loja" class="cover-img" alt="Capa" />
    <label id="cover-upload-label" for="cover-file-input" class="cover-upload-btn">
      <i class="fa-solid fa-camera"></i> Alterar Capa
    </label>
    <input type="file" id="cover-file-input" accept="image/*" />
  </div>

  <!-- Nome e Descrição da Loja -->
  <div class="header-info">
    <h1 id="store-name">Minha Loja Virtual</h1>
    <p id="store-desc">Confira nossos produtos abaixo!</p>
  </div>

  <!-- Lista de Produtos -->
  <div class="container">
    <h2 class="section-title">Produtos</h2>
    <div id="products-container">
      <!-- Lista gerenciada dinamicamente pelo Firebase -->
    </div>
  </div>

  <!-- MODAL LOGIN (ADM) -->
  <div id="modal-login" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">Acesso do Administrador</div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="login-email" placeholder="admin@email.com" />
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="login-pass" placeholder="******" />
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeLoginModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="loginAdmin()">Entrar</button>
      </div>
    </div>
  </div>

  <!-- MODAL ADICIONAR/EDITAR PRODUTO (ADM) -->
  <div id="modal-product" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header" id="modal-product-title">Adicionar Produto</div>
      <form id="product-form">
        <input type="hidden" id="prod-current-image-url" />
        
        <div class="form-group">
          <label>Nome do Produto</label>
          <input type="text" id="prod-name" required placeholder="Ex: Hambúrguer" />
        </div>
        
        <div class="form-group">
          <label>Descrição</label>
          <textarea id="prod-desc" rows="3" placeholder="Ingredientes e detalhes..."></textarea>
        </div>

        <div class="form-group">
          <label>Preço (R$)</label>
          <input type="number" step="0.01" id="prod-price" required placeholder="25.00" />
        </div>

        <div class="form-group">
          <label>Imagem (Selecione da Galeria)</label>
          <input type="file" id="prod-file-input" accept="image/*" style="display:block;" />
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeProductModal()">Cancelar</button>
          <button type="submit" class="btn btn-success">Salvar</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
